name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı dal üzerinde arka arkaya push yapıldığında eski çalışmaları iptal et.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Lint ve testler ayrı adımlarda: hangisinin kırıldığı GitHub arayüzünde
      # tek bakışta görünsün.
      - name: Lint (ruff)
        run: ruff check .

      # Bağımlılıklarda bilinen zafiyet taraması. Tek tek CVE'leri elle
      # sabitlemek yerine tarama otomatikleştirildi: yeni bir zafiyet
      # yayımlandığında bir sonraki push'ta görünür olur.
      # Transitif bağımlılıklar da dahil olsun diye kurulu ortamın tamamı
      # taranıyor (-r requirements.txt yalnızca doğrudan olanları görürdü).
      - name: Security audit (pip-audit)
        run: pip-audit --strict

      - name: Test (pytest + coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag pcap-forensic:ci .

      # İmajın derlenmesi yetmez, ÇALIŞTIĞI da doğrulanmalı: bağımlılıkları
      # eksik ya da izinleri hatalı bir imaj da sorunsuz "build" olur.
      # Demo capture imajın içinde geldiği için ek bir dosyaya gerek yok.
      - name: Run the tool inside the image
        run: |
          # Dizin önceden ve yazılabilir olarak yaratılıyor: docker'ın kendisi
          # yaratırsa root'a ait olur ve imajdaki root olmayan kullanıcı içine
          # yazamaz (runner UID'si ile imajdaki UID 1000 aynı değil).
          mkdir -p ci-out && chmod 777 ci-out
          docker run --rm --volume "$PWD/ci-out:/app/reports" \
            pcap-forensic:ci -f samples/malicious/demo_capture.pcapng --format all
          # Dört biçimin de host'a yazıldığını doğrula (HTML + JSON + PDF + 3 CSV).
          ls -1 ci-out/malicious
          test -f ci-out/malicious/demo_capture_report.html
          test -f ci-out/malicious/demo_capture_report.json
          test -f ci-out/malicious/demo_capture_report.pdf
          test -f ci-out/malicious/demo_capture_findings.csv

      # .dockerignore'da "*.pcapng" deseni alt klasörleri KAPSAMAZ; bu daha
      # önce geliştirme makinesindeki 1,3 GB'lık gerçek capture'ın imaja
      # gömülmesine ve imajın 3,19 GB olmasına yol açtı. Bu adım, deseni
      # bozan bir değişikliği yakalar.
      - name: Assert no evidence file leaked into the image
        run: |
          captures=$(docker run --rm --entrypoint sh pcap-forensic:ci \
            -c 'find /app/samples -name "*.pcap" -o -name "*.pcapng"')
          echo "İmajdaki capture'lar: $captures"
          if [ "$captures" != "/app/samples/malicious/demo_capture.pcapng" ]; then
            echo "::error::Sentetik demo dışında bir capture imaja girmiş."
            exit 1
          fi

      - name: Assert .env did not leak into the image
        run: |
          if docker run --rm --entrypoint sh pcap-forensic:ci -c 'test -e /app/.env'; then
            echo "::error::.env imaja girmiş -- API anahtarları sızmış olabilir."
            exit 1
          fi
